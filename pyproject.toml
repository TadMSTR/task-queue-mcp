[project]
name = "task-queue-mcp"
version = "0.14.0"
description = "FastMCP server exposing the agent orchestration task queue as MCP tools"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0.0,<4.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# agent-bus is a TEST-ONLY dependency: tests/test_events.py runs every event file this
# server writes through agent-bus's own outbox validator, which is the gate on the file
# contract. The server never imports it. Pinned by SHA (tags are mutable); keep the version
# named here in step: agent-bus v0.5.0.
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff==0.16.0",
    "agent-bus @ git+https://github.com/TadMSTR/agent-bus@bc0d21b5fae576f45de97f0ab02c3d4ae870791a",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B", "SIM"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 80
show_missing = true
